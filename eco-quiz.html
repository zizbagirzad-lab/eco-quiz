<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eco-Quiz | Eco Start-Up Club</title>
<style>
:root{
  --forest:#12372a; --forest-2:#1b4d3a; --leaf:#2e7d5b; --mint:#cfe8d9; --paper:#f3f6f4; --card:#fff;
  --ink:#16251d; --muted:#5d6f64; --line:#dbe4de; --ok:#1e8e5a; --ok-bg:#e3f5ea; --bad:#c8453f; --bad-bg:#fbe7e5;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper)}
.app{min-height:100vh;display:grid;grid-template-columns:minmax(300px,42%) 1fr}
/* Sol panel */
.brand{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--forest),var(--forest-2));color:#fff;padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between}
.brand svg.bg{position:absolute;right:-60px;bottom:-60px;width:380px;opacity:.12}
.mark{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.2px}
.mark span.ico{width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center}
.brand h1{font-family:var(--serif);font-size:clamp(2.2rem,4vw,3.4rem);line-height:1.05;margin:0 0 14px;font-weight:700}
.brand p{margin:0;max-width:34ch;line-height:1.55;color:#cfe3d8}
.facts{display:flex;gap:28px;font-size:.9rem;color:#cfe3d8;position:relative}
.facts b{display:block;font-family:var(--serif);font-size:1.6rem;color:#fff}
/* Sağ panel */
.main{display:flex;align-items:center;justify-content:center;padding:40px 28px}
.panel{width:100%;max-width:520px}
.screen{display:none}.screen.active{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-family:var(--serif);font-size:1.7rem;line-height:1.25;margin:0 0 8px}
.lead{color:var(--muted);line-height:1.55;margin:0 0 24px}
label{display:block;font-weight:600;margin-bottom:8px}
input{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--card)}
input:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(46,125,91,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.field{margin-bottom:4px}
@media (max-width:520px){.row{grid-template-columns:1fr;gap:16px}}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin:8px 0 14px}
.btn{width:100%;border:0;border-radius:12px;padding:15px 20px;font:inherit;font-weight:700;color:#fff;background:var(--forest);cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:var(--leaf)}.btn:active{transform:scale(.99)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #7bc99a;outline-offset:2px}
/* Quiz */
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.segs{display:flex;gap:5px;margin-bottom:26px}
.segs i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.segs i.done{background:var(--leaf)}.segs i.now{background:var(--forest)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt .k{flex:none;width:32px;height:32px;border-radius:9px;background:var(--mint);color:var(--forest);font-weight:700;display:grid;place-items:center}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.why{display:none;margin:6px 0 16px;padding:14px 16px;border-radius:12px;background:#eaf1ed;color:var(--ink);line-height:1.5;font-size:.95rem}
#next{display:none}
/* Nəticə */
.ring{position:relative;width:170px;height:170px;margin:0 auto 20px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .tr{stroke:var(--line)}.ring .pr{stroke:var(--leaf);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1s ease}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:2.4rem;font-weight:700}
.center{text-align:center}
.badge{display:inline-block;margin:6px 0 10px;padding:9px 18px;border-radius:99px;background:var(--mint);color:var(--forest);font-weight:700}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .brand{padding:26px 24px 30px;gap:20px}
  .brand svg.bg{width:240px}.brand p,.facts{display:none}
  .brand h1{font-size:2rem;margin:0}
  .main{align-items:flex-start;padding:28px 20px 40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="brand">
    <div class="mark"><span class="ico" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12372a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C10 4 4 9 4 15a5 5 0 0 0 5 5c6 0 11-6 11-16Z"/><path d="M4 20c3-6 7-9 12-11"/></svg></span>
      Eco Start-Up Club</div>
    <div>
      <h1>Eco-Quiz</h1>
      <p>Ekologiya, tullantıların idarə olunması, karbon izi və enerji qənaəti üzrə biliyini yoxla.</p>
    </div>
    <div class="facts"><div><b>15</b>sual</div><div><b>4</b>variant</div><div><b>~3 dəq</b>müddət</div></div>
    <svg class="bg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1" aria-hidden="true"><path d="M20 4C10 4 4 9 4 15a5 5 0 0 0 5 5c6 0 11-6 11-16Z"/><path d="M4 20c3-6 7-9 12-11"/></svg>
  </aside>

  <main class="main"><div class="panel">

    <section id="welcome" class="screen active">
      <h2>Xoş gəldin!</h2>
      <p class="lead">Adını yaz və viktorinaya başla. Hər sualdan sonra düzgün cavabı və qısa izahı görəcəksən.</p>
      <div class="row">
        <div><label for="name">Ad:</label>
        <input id="name" type="text" maxlength="30" autocomplete="given-name"></div>
        <div><label for="surname">Soyad:</label>
        <input id="surname" type="text" maxlength="30" autocomplete="family-name"></div>
      </div>
      <div class="field"><label for="group">Qrup:</label>
      <input id="group" type="text" maxlength="20" autocomplete="off"></div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="start">Oyuna Başla</button>
    </section>

    <section id="quiz" class="screen">
      <div class="top"><span id="meta"></span><span id="live"></span></div>
      <div class="segs" id="segs"></div>
      <h2 id="question"></h2>
      <div id="options" style="margin-top:20px"></div>
      <div class="why" id="why" aria-live="polite"></div>
      <button class="btn" id="next">Növbəti sual</button>
    </section>

    <section id="result" class="screen center">
      <div class="ring">
        <svg width="170" height="170" viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="54"/><circle class="pr" id="pr" cx="60" cy="60" r="54"/></svg>
        <div class="num" id="score"></div>
      </div>
      <h2 id="resName"></h2>
      <p class="lead" id="resGroup" style="margin:0 0 8px"></p>
      <div class="badge" id="status"></div>
      <p class="lead" id="msg"></p>
      <button class="btn" id="restart">Yenidən Başla</button>
    </section>

  </div></main>
</div>

<script>
// answer: düzgün variantın nömrəsi (0=A, 1=B, 2=C, 3=D); why: qısa izah
const questions = [
  {q:"Plastik butulka təbiətdə təxminən nə qədər müddətə parçalanır?", opts:["5 il","50 il","Təxminən 450 il","5 gün"], answer:2, why:"Plastik çox yavaş parçalanır, ona görə onu azaltmaq və təkrar emal etmək vacibdir."},
  {q:"Karbon izi nədir?", opts:["Ayaqqabının yerdə qoyduğu iz","Fəaliyyətimiz nəticəsində atmosferə atılan istixana qazlarının miqdarı","Torpaqdakı karbon qatı","Odun yananda qalan kül"], answer:1, why:"Karbon izi nəqliyyat, enerji və qida kimi gündəlik fəaliyyətlərdən yaranır."},
  {q:"Hansı enerji mənbəyi bərpaolunandır?", opts:["Kömür","Neft","Günəş enerjisi","Təbii qaz"], answer:2, why:"Günəş, külək və su enerjisi bitmir. Kömür, neft və qaz isə tükənən mənbələrdir."},
  {q:"Evdə enerjiyə qənaət etmək üçün ən sadə addım hansıdır?", opts:["Otaqdan çıxanda işığı söndürmək","Lampaları bütün günü yandırmaq","Cihazları həmişə gözləmə rejimində saxlamaq","Pəncərə açıq halda qızdırıcını işlətmək"], answer:0, why:"İstifadə olunmayan işıq boş yerə enerji sərf edir."},
  {q:"Hansı tullantı təkrar emal üçün ən uyğundur?", opts:["Yemək qalıqları","Kağız və karton","Çirkli salfetlər","Sınmış güzgü"], answer:1, why:"Kağız və karton təkrar emal olunub yenidən istifadə edilə bilər."},
  {q:"Qlobal istiləşməyə ən çox təsir edən istixana qazı hansıdır?", opts:["Oksigen","Azot","Karbon dioksid (CO₂)","Hidrogen"], answer:2, why:"CO₂ yanacağın yanması zamanı ən çox ayrılan istixana qazıdır."},
  {q:"“3R” qaydası nə deməkdir?", opts:["Azalt, təkrar istifadə et, təkrar emal et","Al, at, yandır","Yığ, sat, at","Qaz, su, işıq"], answer:0, why:"3R: Reduce (azalt), Reuse (təkrar istifadə), Recycle (təkrar emal)."},
  {q:"Alış-veriş üçün hansı çanta ekoloji baxımdan daha yaxşıdır?", opts:["Birdəfəlik polietilen torba","Dəfələrlə istifadə olunan parça çanta","Hər dəfə yeni plastik torba","Qalın plastik paket"], answer:1, why:"Parça çanta uzun müddət işləyir və plastik tullantını azaldır."},
  {q:"Ağaclar atmosferdən hansı qazı udur?", opts:["Metan","Azot oksidi","Hidrogen","Karbon dioksid (CO₂)"], answer:3, why:"Ağaclar fotosintez zamanı CO₂ udur və oksigen buraxır."},
  {q:"Hansı nəqliyyat vasitəsinin karbon izi ən azdır?", opts:["Təkbaşına sürülən avtomobil","Təyyarə","Velosiped","Dizel yük maşını"], answer:2, why:"Velosiped yanacaq yandırmır, ona görə karbon izi demək olar ki, yoxdur."},
  {q:"Hansı hərəkət su qənaətinə kömək edir?", opts:["Dişləri fırçalayanda kranı bağlamaq","Kranı həmişə açıq qoymaq","Maşını hər gün yumaq","Duşda uzun müddət qalmaq"], answer:0, why:"Lazım olmayanda kranı bağlamaq gündə onlarla litr suya qənaət edir."},
  {q:"Yemək qalıqları kimi üzvi tullantılardan nə hazırlamaq olar?", opts:["Plastik","Kompost (üzvi gübrə)","Şüşə","Metal"], answer:1, why:"Üzvi tullantılar parçalanıb komposta çevrilir və torpağı zənginləşdirir."},
  {q:"LED lampaların adi közərmə lampalarından üstünlüyü nədir?", opts:["Daha çox elektrik işlədir","Daha tez sönür","Daha az enerji işlədir və daha uzun ömürlüdür","Daha çox istilik yayır"], answer:2, why:"LED lampalar eyni işığı xeyli az enerji ilə verir və uzun müddət işləyir."},
  {q:"Hansı tullantı adi zibildən ayrıca toplanmalıdır?", opts:["İstifadə olunmuş batareyalar","Kağız","Banan qabığı","Karton qutu"], answer:0, why:"Batareyalarda zərərli maddələr var, ona görə xüsusi toplama məntəqələrinə verilməlidir."},
  {q:"Yer Günü hər il hansı tarixdə qeyd olunur?", opts:["5 iyun","22 mart","22 aprel","1 yanvar"], answer:2, why:"Yer Günü 22 aprel tarixində qeyd olunur. 5 iyun isə Ümumdünya Ətraf Mühit Günüdür."}
];

let current = 0, score = 0, playerName = "", playerGroup = "", answered = false;
const $ = id => document.getElementById(id);
const letters = ["A","B","C","D"];

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

function startGame(){
  const name = $("name").value.trim(), surname = $("surname").value.trim(), group = $("group").value.trim();
  const missing = !name ? "name" : !surname ? "surname" : !group ? "group" : "";
  if(missing){
    $("err").textContent = "Zəhmət olmasa, ad, soyad və qrupu doldur.";
    $(missing).focus(); return;
  }
  $("err").textContent = "";
  playerName = name + " " + surname; playerGroup = group; current = 0; score = 0;
  show("quiz"); showQuestion();
}

function showQuestion(){
  const item = questions[current];
  answered = false;
  $("meta").textContent = "Sual " + (current + 1) + " / " + questions.length;
  $("live").textContent = "Xal: " + score;
  $("segs").innerHTML = questions.map((_, i) => '<i class="' + (i < current ? "done" : i === current ? "now" : "") + '"></i>').join("");
  $("question").textContent = item.q;
  $("why").style.display = "none";
  $("next").style.display = "none";
  $("next").textContent = current === questions.length - 1 ? "Nəticəni gör" : "Növbəti sual";
  const box = $("options"); box.innerHTML = "";
  item.opts.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="k">' + letters[i] + '</span><span></span>';
    b.lastChild.textContent = text;
    b.onclick = () => choose(i);
    box.appendChild(b);
  });
}

// Düzgün cavab yaşıl, səhv cavab qırmızı
function choose(i){
  if(answered) return;
  answered = true;
  const item = questions[current];
  document.querySelectorAll(".opt").forEach((b, idx) => {
    b.disabled = true;
    if(idx === item.answer) b.classList.add("correct");
    else if(idx === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if(i === item.answer) score++;
  $("live").textContent = "Xal: " + score;
  $("why").textContent = (i === item.answer ? "Düzgün! " : "Düzgün cavab: " + letters[item.answer] + ". ") + item.why;
  $("why").style.display = "block";
  $("next").style.display = "block";
  $("next").focus();
}

function next(){
  current++;
  current < questions.length ? showQuestion() : showResult();
}

function showResult(){
  show("result");
  const total = questions.length;
  $("resName").textContent = playerName + ", nəticən";
  $("resGroup").textContent = "Qrup: " + playerGroup;
  $("score").textContent = score + "/" + total;
  let status, msg;
  if(score / total >= 0.9){ status = "🌿 Eko-Ekspert"; msg = "Əla nəticə! Ekologiya sahəsində biliyin çox güclüdür."; }
  else if(score / total >= 0.5){ status = "🌱 Eko-Həvəskar"; msg = "Yaxşı nəticə! Bir az da öyrənsən, ekspert ola bilərsən."; }
  else { status = "🌍 Eko-Yolun Başlanğıcında"; msg = "Yaxşı başlanğıc! Yenidən cəhd et, hər dəfə daha yaxşı olacaq."; }
  $("status").textContent = status; $("msg").textContent = msg;
  const pr = $("pr"); pr.style.strokeDashoffset = 339.3;
  setTimeout(() => pr.style.strokeDashoffset = 339.3 * (1 - score / total), 80);
}

$("start").onclick = startGame;
$("next").onclick = next;
$("restart").onclick = () => { $("name").value = ""; $("surname").value = ""; $("group").value = ""; show("welcome"); $("name").focus(); };
["name","surname","group"].forEach(id => $(id).addEventListener("keydown", e => { if(e.key === "Enter") startGame(); }));
// Klaviatura: A-D və ya 1-4 ilə cavab seçmək
document.addEventListener("keydown", e => {
  if(!$("quiz").classList.contains("active") || answered) return;
  const k = e.key.toUpperCase(), i = letters.indexOf(k) >= 0 ? letters.indexOf(k) : parseInt(k, 10) - 1;
  if(i >= 0 && i < 4) choose(i);
});
</script>
</body>
</html>
